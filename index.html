<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <link rel="stylesheet" href="./css/output.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js"></script>
</head>

<body class="bg-slate-950">
    <header class="bg-slate-900 h-15 flex items-center px-4">
        <div>
            <a href="#">
                <div class="">
                    <img src="./assets/images/logo-svg.svg" alt="logo CineTrack" class=" h-10 w-auto">
                </div>
            </a>
        </div>
    </header>
    <main class="flex px-2 md:px-8 flex-col gap-1 text-sm">
        <div class="m-4">
            <h3 class="text-slate-100 text-3xl font-bold">Catalogue Films & Séries</h3>
            <p class="text-slate-400">Explorez, filtrez et sauvegardez vos chefs-d'œuvre favoris en un clic</p>

        </div>

        <section
            class="flex flex-col gap-1 py-3 px-4 bg-slate-900 rounded-xl border-slate-800 shadow-slate-900 md:my-4 md:flex-row md:justify-between">
            <div>
                <label for="rechercher"></label>
                <input type="text" name="rechercher" id="rechercher" placeholder="Recherrcher par titre..."
                    class="bg-slate-800 border w-full border-slate-950 rounded-sm  py-1 px-2 focus:outline-0 md:w-100">
            </div>
            <div class="grid grid-cols-3 items-center justify-between gap-2 bg-slate-950 text-slate-800 font-semibold rounded-sm p-1 border border-slate-800 md:w-120"
                id="filter">
                <button class="px-2 hover:hover:bg-slate-700 focus:bg-red-700 rounded-sm cursor-pointer"
                    data-type="Tous">Tous</button>
                <button class="px-2 hover:hover:bg-slate-700 focus:bg-red-700 rounded-sm cursor-pointer"
                    data-type="movie">Movie</button>
                <button class="px-2 hover:hover:bg-slate-700 focus:bg-red-700 rounded-sm cursor-pointer"
                    data-type="series">Series</button>
            </div>
        </section>

        <section class="grid sm:grid-cols-3 md:grid-cols-4 md:flex gap-2">
            <div class="col-span-3">
                <div class="flex justify-between text-slate-600 mb-2">
                    <span class="">29 titres trouvés</span>
                    <span>Filtre : Tous</span>
                </div>
                <div id="container-cards"
                    class="grid grid-cols sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 text-slate-400 ">
                    <!-- les cards sens affichier par DOM-->
                </div>
            </div>
            <aside class="col-span-3 w-full md:col-span-1 bg-slate-900 rounded-lg ">
                <div class="text-center">
                    <h2 class="text-lg text-amber-600 font-semibold mb-2 border rounded-lg">Mes favoris</h2>
                    <div class="p-2 flex flex-col">
                        <div id="contenair-favoris" class="flex flex-col gap-1">
                            

                        </div>
                    </div>
                </div>
            </aside>

        </section>

        <div id="pagination" class="m-4 flex justify-center">
            <ul id="listePaenation" class="flex gap-3"></ul>
        </div>

    </main>
    <footer class="bg-slate-900 flex h-15 rounded-t-xl items-center justify-center">
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing.</p>
    </footer>
    <script type="module" src="/js/render.js"></script>
</body>

</html>
