<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <link rel="stylesheet" href="./css/output.css">
</head>
<body class="bg-slate-950">
    <header class="bg-slate-900 h-15 flex items-center px-4">
        <div>
            <a href="#">
                <div>
                    <img src="./assets/images/logo-svg.svg" alt="logo CineTrack" class=" h-10 w-auto">
                </div>
            </a>
        </div>
    </header>
    <main class="flex px-4 flex-col gap-1 text-sm">
        <h3 class="text-slate-100 text-3xl font-bold">Catalogue Films & Séries</h3>
        <p class="text-slate-400">Explorez, filtrez et sauvegardez vos chefs-d'œuvre favoris en un clic</p>
        <section class="flex justify-between py-3 px-4 bg-slate-900 rounded-xl border-slate-800 shadow-slate-900 my-4">
            <div>
                <label for="rechercher"></label>
                <input type="text" name="rechercher" id="rechercher" placeholder="Recherrcher par titre..." class="bg-slate-800 border border-slate-950 rounded-sm w-60 py-1 px-2 focus:outline-0">
            </div>
            <div class="flex items-center justify-between gap-2 bg-slate-950 text-slate-800 font-semibold rounded-sm p-1 border border-slate-800">
                <button class="px-2 hover:hover:bg-slate-700 focus:bg-red-600 rounded-sm">Tous</button>
                <button class="px-2 hover:hover:bg-slate-700 focus:bg-red-600 rounded-sm">Films</button>
                <button class="px-2 hover:hover:bg-slate-700 focus:bg-red-600 rounded-sm">Series</button>
            </div>
        </section>
        <div class="flex justify-between text-slate-600">
            <span class="">16 titres trouvés</span>
            <span>Filtre : Tous</span>
        </div>
        <div id="cards">

        </div>
        <div id="pagination">

        </div>
    </main>
    <footer class="bg-slate-900 flex h-15 rounded-t-xl items-center justify-center">
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing.</p>
    </footer>
</body>
</html>
